<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231F5A35'/><path d='M12 42h8v44h-8zM32 36h8v50h-8zM60 36h8v50h-8zM80 42h8v44h-8z' fill='white'/><path d='M8 54h84v6H8zM8 72h84v6H8z' fill='%23E9B44C'/></svg>">
<title>مَراح | إدارة الحلال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Rakkas&display=swap">
<style>
:root{--bg:#eef2ea;--surf:#fff;--ink:#14241a;--mut:#5d6f62;--line:#dbe3d6;--pri:#1f5a35;--onpri:#fff;--gold:#c98a12;--dng:#c4442e;--soft:#e3ebde;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0d1810;--surf:#15261b;--ink:#eaf0e6;--mut:#94a898;--line:#234030;--pri:#5fbf84;--onpri:#0d1810;--gold:#efb94a;--dng:#ef7a62;--soft:#1b3324}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.6 'IBM Plex Sans Arabic',Tahoma,sans-serif;min-height:100vh}
h1,h2,h3,.num{font-family:'IBM Plex Sans Arabic','IBM Plex Sans Arabic',Tahoma,sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#splash{position:fixed;inset:0;z-index:900;background:#10301c;color:#f3efe0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;transition:opacity .7s,visibility .7s}
#splash.off{opacity:0;visibility:hidden}
#splash .logo{font-size:64px;width:120px;height:120px;border-radius:50%;background:#e9b44c;display:grid;place-items:center;animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
#splash h1{font-size:3rem;font-weight:700;letter-spacing:0}
#splash p{opacity:.8;max-width:30ch}
#splash button{margin-top:10px;background:#e9b44c;color:#10301c;font-weight:700;padding:13px 38px;border-radius:99px;font-size:1.1rem}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 1.5rem 'IBM Plex Sans Arabic','IBM Plex Sans Arabic',sans-serif}
.brand i{font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:20px}
.ib{width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:18px}
nav{position:fixed;bottom:0;inset-inline:0;z-index:60;display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav{overflow-x:auto}nav button{flex:1 0 58px;padding:11px 2px 9px;font-size:.85rem;font-weight:500;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button b{font-size:1.75rem;font-weight:400;line-height:1.1}
nav button.on{color:var(--pri);font-weight:700}
nav button.on b{transform:translateY(-2px)}
main{max-width:980px;margin:0 auto;padding:18px 16px 124px}
.hero{background:var(--pri);color:var(--onpri);border-radius:26px;padding:22px;display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:center;margin-bottom:16px}
.hero h2{font-size:1.5rem;line-height:1.3}
.hero p{opacity:.85;font-size:.95rem;margin-top:4px}
.hero .big{font:700 3.6rem/1 'IBM Plex Sans Arabic',sans-serif;margin-top:10px}
.hero svg{width:150px;height:150px;transform:rotate(-90deg)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.legend button{background:rgba(255,255,255,.16);border-radius:99px;padding:3px 11px;font-size:.8rem;display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:start;transition:transform .2s,border-color .2s}
.kpi:hover{transform:translateY(-3px);border-color:var(--pri)}
.kpi small{color:var(--mut);display:block}
.kpi .num{font-size:2rem;font-weight:700}
.kpi.bad .num{color:var(--dng)}
.kpi.gold .num{color:var(--gold)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{font-size:1.15rem;margin-bottom:10px}
.alert{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:14px;margin-bottom:8px;background:var(--soft);border-inline-start:5px solid var(--gold)}
.alert.red{border-color:var(--dng)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.bar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width 1s}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);font-size:.8rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.toolbar input{flex:2 1 160px}.toolbar select{flex:1 1 120px}
.btn{background:var(--pri);color:var(--onpri);font-weight:700;border-radius:12px;padding:10px 18px}
.btn.wa{background:#1fa855;color:#fff}
.mini{padding:5px 9px;border-radius:9px;background:var(--soft);font-size:.9rem}
.mini.d{color:var(--dng)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th{color:var(--mut);font-weight:500;font-size:.85rem;text-align:start;padding:8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
td:last-child{white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:22px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--mut)}
.bars i{display:block;width:100%;max-width:46px;background:var(--pri);border-radius:8px 8px 0 0;min-height:3px;transition:height .8s}
#modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--surf);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px;animation:up .28s ease-out}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin-bottom:12px;font-size:1.3rem}
.sheet label{display:block;margin-bottom:10px;font-weight:500}
.sheet label input,.sheet label select{margin-top:4px}
.sheet .btn{width:100%;margin-top:6px}
#toast{position:fixed;bottom:84px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:500;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.idc{background:#f6fbfa;color:#0b2a2a;border-radius:22px;overflow:hidden;border:1px solid #bfe0dc;box-shadow:0 10px 30px rgba(14,143,138,.25);margin-bottom:12px}
.idh{background:linear-gradient(120deg,#0b6e6a,#14b5ab);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.idh b{font:700 1.05rem 'IBM Plex Sans Arabic',sans-serif}.idh small{opacity:.85;display:block;font-size:.72rem}
.cross{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;color:#d6342a;font-weight:700;font-size:1.4rem}
.idb{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:16px}
.ph{width:96px;height:120px;border-radius:12px;background:#dff0ee center/cover;display:grid;place-items:center;font-size:40px;border:2px solid #14b5ab;cursor:pointer}
.idb h2{font-size:1.9rem;letter-spacing:1px;line-height:1.1}.idb p{font-size:.85rem;color:#3d6462}
.st{display:inline-flex;align-items:center;gap:7px;padding:3px 12px;border-radius:99px;font-weight:700;font-size:.85rem;margin-top:6px}
.st i{width:9px;height:9px;border-radius:50%;animation:pl 1.4s infinite}
.st.ok{background:#d9f5e4;color:#0c7a3e}.st.ok i{background:#16a34a}.st.warn{background:#fdf0c9;color:#8a5a00}.st.warn i{background:#e0a100}.st.bad{background:#fde0db;color:#a5281a}.st.bad i{background:#dc2f1f}
@keyframes pl{50%{transform:scale(1.8);opacity:.4}}
.ecg{display:block;width:100%;height:46px;background:#eaf6f5}.ecg path{stroke-dasharray:400;animation:ec 2.6s linear infinite}
@keyframes ec{from{stroke-dashoffset:400}to{stroke-dashoffset:-400}}
.vit{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#cfe6e3;border-top:1px solid #cfe6e3}
.vit div{background:#f6fbfa;padding:10px 12px;font-size:.72rem;color:#4b7370}.vit b{display:block;font-size:.95rem;color:#0b2a2a}
.idf{padding:10px 16px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:.75rem;color:#4b7370}.idf svg{height:44px;width:auto}
@media print{header,nav,main,#toast,#splash,#fab,.noprint{display:none!important}#modal{position:static;background:none;display:block}.sheet{max-height:none;animation:none;padding:0;background:#fff;color:#000}body{background:#fff}}
@media(min-width:820px){
nav{inset:0 0 0 auto;width:150px;flex-direction:column;border-top:0;border-inline-start:1px solid var(--line);padding-top:72px;justify-content:flex-start;gap:4px}
nav button{flex:0;flex-direction:row;gap:10px;font-size:.95rem;padding:12px 18px;justify-content:flex-start}nav button b{font-size:1.4rem}
main{margin-inline:auto 170px;padding-bottom:40px}
header{padding-inline-end:170px}
#toast{bottom:30px}}
@media(max-width:480px){.hero{grid-template-columns:1fr}.hero svg{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#fab{position:fixed;left:16px;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:70;width:60px;height:60px;border-radius:50%;background:var(--gold);color:#1a1200;font-size:2.2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#toast.u{pointer-events:auto}
.toolbar .btn{flex:1 1 110px}
.qg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.qg button{background:var(--soft);border-radius:16px;padding:16px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}.qg b{font-size:1.9rem;font-weight:400}
.seg{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:14px;margin-bottom:14px}.seg button{flex:1;padding:10px 4px;border-radius:10px;font-weight:500}.seg button.on{background:var(--pri);color:var(--onpri);font-weight:700}
.task{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px;border-radius:14px;background:var(--soft);margin-bottom:8px;font-weight:500;font-size:1.05rem}.task b{font-size:1.5rem;font-weight:400}.task span{flex:1}.task.bad{background:var(--dng);color:#fff}
.hr{width:100%;text-align:start;gap:12px;padding:13px 4px}
@media(min-width:820px){#fab{bottom:24px;left:24px}}
#gate{position:fixed;inset:0;z-index:950;background:#10301c;color:#f3efe0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}#gate .logo{font-size:56px}#gate h1{font-size:2rem}#gate code{background:rgba(255,255,255,.12);padding:8px 14px;border-radius:10px;word-break:break-all;direction:ltr;font-size:.95rem}#gate .btn{background:#e9b44c;color:#10301c}
#tour{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.62);display:none}
#tb{position:fixed;z-index:1003;background:var(--surf);color:var(--ink);border-radius:18px;padding:16px;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#tb b{font:700 1.2rem 'IBM Plex Sans Arabic','IBM Plex Sans Arabic',sans-serif;color:var(--pri)}#tb p{margin:6px 0 10px}#tb small{color:var(--mut)}
body.touring nav,body.touring #fab{z-index:1002}
.tr{outline:3px solid var(--gold);outline-offset:-3px;border-radius:14px;background:var(--soft)!important;animation:pl2 1.2s infinite}
@keyframes pl2{50%{box-shadow:0 0 0 8px rgba(233,180,76,.35)}}
html{font-size:14.5px}input,select,textarea{font-size:16px}
#gate{overflow-y:auto;background:linear-gradient(160deg,#0f2f1b,#1F5A35)}
#gate .box{margin:auto;width:100%;max-width:380px;background:#fff;color:#14241a;border-radius:26px;padding:26px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.gw{font-size:1rem;color:#8a5a00;font-weight:600}.gs{font-size:1.35rem;font-weight:700;margin-bottom:6px}
.gl{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 18px}.gn{font-family:'Rakkas','IBM Plex Sans Arabic',sans-serif;font-size:3.2rem;color:#1F5A35;line-height:1}
.gt{display:flex;gap:4px;background:#e8eee4;border-radius:14px;padding:4px;margin-bottom:14px}.gt button{flex:1;padding:10px;border-radius:10px;font-weight:600;color:#46584c}.gt button.on{background:#1F5A35;color:#fff}
#gate form{display:flex;flex-direction:column;gap:10px;text-align:start}
#gate .box input{background:#f4f7f1;color:#14241a;border:1px solid #d6ddd2}
.gb{background:#1F5A35;color:#fff;font-weight:700;border-radius:12px;padding:13px}
.gp{color:#5d6f62;font-size:.9rem;margin-top:4px}.gh{font-size:1.2rem;margin-bottom:6px}
.gfoot{margin-top:18px;padding-top:14px;border-top:1px solid #e3e9de;display:flex;flex-direction:column;gap:10px;align-items:center}
.gsup{display:block;width:100%;background:#1fa855;color:#fff;font-weight:700;border-radius:12px;padding:11px;text-decoration:none}.gfoot small{color:#7a8a7f}
.lg-a{fill:var(--pri)}.lg-b{fill:var(--gold)}
.brand{font-family:'Rakkas','IBM Plex Sans Arabic',sans-serif!important;font-weight:400!important;font-size:1.7rem!important}.brand svg{flex:none}
.cross svg{width:26px;height:26px}.cross{width:42px}
#splash{z-index:1200;background:linear-gradient(170deg,#0f2f1b,#1F5A35);justify-content:space-between;padding:44px 18px 30px;gap:0}
.sp-top{text-align:center;color:#f3efe0}.sp-top svg{display:block;margin:0 auto 4px}
.sp-name{font-family:'Rakkas','IBM Plex Sans Arabic',sans-serif;font-size:3.8rem;line-height:1.1;color:#fff}.sp-tag{font-size:1.15rem;color:#E9B44C;font-weight:600}
.sp-scene{width:min(96vw,580px);height:auto}
#splash .sp-skip{margin:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:8px 28px;font-size:1rem;font-weight:500}
.sp-bar{width:min(70vw,260px);height:4px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}.sp-bar i{display:block;height:100%;background:#E9B44C;width:0;animation:spf 5s linear forwards}
@keyframes spf{to{width:100%}}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:lr .34s ease-in-out infinite alternate}.l2,.l3{animation-delay:-.17s}
@keyframes lr{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.bob{animation:bb .34s ease-in-out infinite alternate}.b2{animation-delay:-.12s}.b3{animation-delay:-.22s}
@keyframes bb{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.ft{transform-box:fill-box;animation:ftk .34s ease-in-out infinite alternate}.f2{animation-delay:-.17s}
@keyframes ftk{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.pp{transform-box:fill-box;transform-origin:100% 80%;animation:ppk .34s ease-in-out infinite alternate}
@keyframes ppk{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
.fl{animation:fly 1.6s linear infinite}.fl2{animation-delay:-.55s}.fl3{animation-delay:-1.1s}
@keyframes fly{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(70px,-36px) rotate(180deg);opacity:0}}
.gr{animation:grm .5s linear infinite}.gr2{animation-duration:.9s}
@keyframes grm{from{stroke-dashoffset:42}to{stroke-dashoffset:0}}
#ph,#pf{display:none}
@media print{#ph{display:flex!important;justify-content:space-between;align-items:center;border-bottom:3px solid #1F5A35;padding-bottom:10px;margin-bottom:14px;color:#14241a}#ph .phr{display:flex;align-items:center;gap:10px}#ph b{font:400 30px 'Rakkas',sans-serif;color:#1F5A35;display:block;line-height:1}#ph small{color:#8a5a00;font-weight:600}#pf{display:block!important;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:#5d6f62;border-top:1px solid #cfd8cb;padding-top:6px}#gate,#tour{display:none!important}}
</style>
</head>

/><path d="M-9 -22L-36 -14" stroke="#d8a77a" stroke-width="5" stroke-linecap="round"/><g class="pp"><rect x="-58" y="-34" width="24" height="30" rx="2" fill="#fff" stroke="#c9d1c3"/><path d="M-54 -26h16M-54 -19h16M-54 -12h11" stroke="#1F5A35" stroke-width="2"/></g><ellipse class="ft f1" cx="-8" cy="32" rx="7" ry="3.5" fill="#3b2f2a"/><ellipse class="ft f2" cx="9" cy="32" rx="7" ry="3.5" fill="#3b2f2a"/></g><g class="fl"><rect x="-40" y="-40" width="10" height="13" rx="1" fill="#fff"/></g><g class="fl fl2"><rect x="-40" y="-36" width="10" height="13" rx="1" fill="#f4efe0"/></g><g class="fl fl3"><rect x="-40" y="-30" width="10" height="13" rx="1" fill="#fff"/></g></g></svg><div class="sp-bar"><i></i></div><button id="go" class="sp-skip">تخطي</button></div>

<button id="fab" data-a="fab" aria-label="عملية سريعة">+</button>
<div id="ph"><div class="phr"><svg viewBox="0 0 100 100" width="46" height="46" aria-hidden="true"><path d="M12 42h8v44h-8zM32 36h8v50h-8zM60 36h8v50h-8zM80 42h8v44h-8z" fill="#1F5A35"/><path d="M8 54h84v6H8zM8 72h84v6H8z" fill="#E9B44C"/></svg><div><b>مَراح</b><small>لإدارة حلالك</small></div></div><div id="phd"></div></div>
<div id="pf">صدر عن تطبيق مَراح لإدارة الحلال © <span id="pfy"></span></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let K='marah_v2';
try{const th=localStorage.getItem('marah_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
const $=s=>document.querySelector(s),PENS=['شبك الولاد والدفيع','شبك الفحول','شبك التسمين والبيع','شبك الطلي'],COL=['#3f9d62','#e9b44c','#4aa3c7','#d9694a','#9a8be0'];
const T=()=>new Date().toISOString().slice(0,10),add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},dl=d=>Math.ceil((new Date(d)-new Date(T()))/864e5),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fm=n=>Number(n).toLocaleString('en');
const seed=()=>({sheep:[],breed:[],weights:[],dead:[],fin:[],vax:[],feed:[],hist:[],m2:1,m3:1});
let D;try{let bk=null,bt=-1;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k=='marah_v2'||(k.startsWith('marah_v3_')&&!k.endsWith('_t'))){const t=+localStorage.getItem(k+'_t')||0;if(t>bt){bt=t;bk=k}}}if(bk)D=JSON.parse(localStorage.getItem(bk))}catch(e){}D=D||seed();D.vax=D.vax||[];D.feed=D.feed||[];D.hist=D.hist||[];
if(!D.m3){D.m3=1;const w=D.sheep.find(x=>x.tag=='W-401'&&!x.since);if(w)w.since=add(T(),-260)}
if(!D.clean){D.clean=1;const DM=['N-101','N-102','N-103','H-201','T-301','T-302','W-401'],nd=x=>!DM.includes(x.tag);D.sheep=D.sheep.filter(nd);['breed','weights','vax','hist'].forEach(k=>D[k]=(D[k]||[]).filter(nd));D.dead=D.dead.filter(x=>x.tag!='M-99');D.fin=D.fin.filter(x=>!['بيع طلي نعيمي','شراء شعير'].includes(x.desc));D.feed=D.feed.filter(x=>!(x.item=='شعير'&&x.kg==200&&x.cost==500)&&!(x.item=='برسيم'&&x.kg==150&&x.cost==300))}
if(!D.m2){D.m2=1;if(!D.vax.length&&!D.feed.length){D.sheep.forEach((s,i)=>D.vax.push({id:uid(),tag:s.tag,name:'الحمى القلاعية',date:add(T(),-170-i*5),next:i==2?add(T(),-5):add(T(),30+i*20)}));D.feed=[{id:uid(),pen:PENS[2],item:'شعير',kg:200,cost:500,date:add(T(),-8)},{id:uid(),pen:PENS[0],item:'برسيم',kg:150,cost:300,date:add(T(),-3)}]}}
let saved=true;const save=()=>{try{localStorage.setItem(K,JSON.stringify(D));localStorage.setItem(K+'_t',Date.now());saved=true}catch(e){saved=false;toast('⚠️ تعذر الحفظ على الجهاز، صدّر نسخة إكسل')}push()};addEventListener('pagehide',()=>save());
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),2200)};
const openM=h=>{$('#sheet').innerHTML=h;$('#modal').classList.add('on')},closeM=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
function form(title,fields,ok){openM(`<h3>${title}</h3><form id="fm">${fields.map(f=>`<label>${f[1]}${f[2]=='select'?`<select name="${f[0]}">${f[3].map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input name="${f[0]}" type="${f[2]}" step="any" value="${esc(f[3]||'')}" ${f[4]=='o'?'':'required'}>`}</label>`).join('')}<button class="btn">حفظ</button></form>`);
$('#fm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));snap=JSON.stringify(D);closeM();ok(d)}}
const tbl=(rows,cols,heads)=>rows.length?`<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'-')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="empty">ما فيه بيانات هنا للحين.</p>';
const sum=t=>D.fin.filter(f=>f.type==t).reduce((s,f)=>s+Number(f.amount),0);
const stats=()=>{const al=D.sheep.length,dd=D.dead.length;return{al,dd,pg:D.sheep.filter(x=>x.status.includes('دفيع')).length,rate:al+dd?(dd/(al+dd)*100).toFixed(1):'0.0',sales:sum('sale'),exp:sum('expense')}};
const males=()=>D.sheep.filter(s=>s.gender=='ذكر').map(s=>s.tag),females=()=>D.sheep.filter(s=>s.gender=='أنثى').map(s=>s.tag),tags=()=>D.sheep.map(s=>s.tag);
const V={};
const lst=(a,t)=>a.filter(x=>x.tag==t).sort((x,y)=>x.date>y.date?1:-1);
const due=t=>{const m={};D.vax.filter(x=>x.tag==t).forEach(x=>{if(!m[x.name]||x.date>m[x.name].date)m[x.name]=x});return Object.values(m)};
const hs=s=>{const v=due(s.tag).map(x=>dl(x.next));if(!v.length)return{c:'warn',t:'لا يوجد تطعيم مسجل'};const m=Math.min(...v);return m<0?{c:'bad',t:'تطعيم متأخر'}:m<=14?{c:'warn',t:'تطعيم قريب'}:{c:'ok',t:'سليم، التطعيمات سارية'}};
const feedPer=p=>D.feed.filter(f=>f.pen==p).reduce((a,f)=>a+Number(f.cost),0)/(D.sheep.filter(s=>s.pen==p).length||1);
const idCard=id=>{const s=D.sheep.find(x=>x.id==id),h=hs(s),w=lst(D.weights,s.tag),lw=w.at(-1),pw=w.at(-2),nx=due(s.tag).sort((a,b)=>a.next>b.next?1:-1)[0],lv=lst(D.vax,s.tag).at(-1),br=D.breed.find(b=>b.tag==s.tag),kids=D.sheep.filter(k=>k.dam==s.tag).length,cost=(+s.buy||0)+feedPer(s.pen);
return `<div class="idc"><div class="idh"><div><b>بطاقة صحية بيطرية</b><small>مراح | المرجع ${esc(s.id.toUpperCase())}</small></div><div class="cross"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M12 42h8v44h-8zM32 36h8v50h-8zM60 36h8v50h-8zM80 42h8v44h-8z" fill="#1F5A35"/><path d="M8 54h84v6H8zM8 72h84v6H8z" fill="#E9B44C"/></svg></div></div><div class="idb"><div class="ph" data-a="photo" data-v="${s.id}" style="${s.photo?`background-image:url(${s.photo})`:''}">${s.photo?'':'🐑'}</div><div><p>رقم الرأس</p><h2 class="num">${esc(s.tag)}</h2><p>${esc(s.sp||'غنم')} | ${esc(s.type)} | ${s.gender=='ذكر'?'ذكر ♂':'أنثى ♀'}</p><p>${esc(s.pen)}</p><span class="st ${h.c}"><i></i>${h.t}</span></div></div><svg class="ecg" viewBox="0 0 400 46" preserveAspectRatio="none"><path d="M0 24H120l8-4 8 4h20l6-18 8 36 8-18h30l8-5 8 5H400" fill="none" stroke="#14b5ab" stroke-width="2"/></svg><div class="vit"><div>آخر وزن<b>${lw?lw.kg+' كجم':'-'}</b>${pw&&lw?(lw.kg>=pw.kg?'▲ ':'▼ ')+Math.abs(lw.kg-pw.kg)+' كجم':''}</div><div>آخر تطعيم<b>${lv?esc(lv.name):'-'}</b>${lv?lv.date:''}</div><div>الجرعة القادمة<b>${nx?nx.next:'-'}</b>${nx?(dl(nx.next)<0?'متأخرة':'بعد '+dl(nx.next)+' يوم'):''}</div><div>الحالة التناسلية<b>${esc(s.status)}</b>${br?'ولادة '+br.due:''}</div><div>النسب<b>${esc(s.dam||'-')} × ${esc(s.sire||'-')}</b>الأم × الأب</div><div>الأبناء | التكلفة<b>${kids} | ${fm(Math.round(cost))}</b>ر.س تقديرية</div><div>الضرابات<b>${s.tries||0}${s.tries>=4?' ⚠️':''}</b>${(D.hist.filter(h=>h.tag==s.tag).at(-1)||{}).gap?'آخر فترة '+D.hist.filter(h=>h.tag==s.tag).at(-1).gap+' يوم':'-'}</div><div>في المراح<b>${s.since?Math.floor(mo(s.since))+' شهر':'غير محدد'}</b>${s.since||''}</div><div>الإنتاجية<b style="color:${probs(s).length?'#a5281a':'#0c7a3e'}">${probs(s).length?'غير منتجة':'جيدة'}</b>${probs(s).length?esc(probs(s)[0][1]):'-'}</div></div><div class="idf"><div>صدرت بتاريخ ${T()}</div>${bars(s.tag)}</div></div><div class="toolbar noprint"><button class="btn wa" data-a="wa" data-v="${s.id}">📱 واتساب</button><button class="btn" data-a="pid" data-v="${s.id}">🖨 طباعة</button><button class="btn" data-a="addV" data-v="${esc(s.tag)}">💉 تطعيم</button><button class="btn" data-a="addW" data-v="${esc(s.tag)}">⚖️ وزن</button><button class="btn" data-a="sell" data-v="${s.id}">💰 بيع</button><button class="btn" data-a="die" data-v="${s.id}">☠️ نفوق</button><button class="btn" data-a="delS" data-v="${s.id}">🗑 حذف</button><button class="btn" data-a="edS" data-v="${s.id}">✏️ تعديل</button></div>`};
V.dash=()=>{const s=stats(),pens={};D.sheep.forEach(x=>pens[x.pen]=(pens[x.pen]||0)+1);const pe=Object.entries(pens);let off=0;
const arcs=pe.map((p,i)=>{const pc=p[1]/s.al*100,r=`<circle r="15.9" cx="18" cy="18" fill="none" stroke="${COL[i%5]}" stroke-width="4.5" stroke-dasharray="${Math.max(pc-1,.5)} ${101-pc}" stroke-dashoffset="${-off}"/>`;off+=pc;return r}).join('');
const up=D.breed.filter(b=>(b.res||'حامل')=='حامل').map(b=>({...b,d:dl(b.due)})).sort((a,b)=>a.d-b.d),near=up.filter(b=>b.d<=14&&b.d>=-5);
const h=new Date().getHours(),g=h<12?'صباح الخير':h<18?'مساء الخير':'مساء النور';
return `<div class="hero"><div><h2>${g}، هذا حال المراح اليوم</h2><p>إجمالي الحلال الحي</p><div class="big num" data-n="${s.al}">0</div><div class="legend">${pe.map((p,i)=>`<button data-a="pen" data-v="${esc(p[0])}"><i style="background:${COL[i%5]}"></i>${esc(p[0].replace('شبك ',''))} ${p[1]}</button>`).join('')}</div></div><svg viewBox="0 0 36 36" role="img" aria-label="توزيع الحلال على الأشباك"><circle r="15.9" cx="18" cy="18" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="4.5"/>${arcs}</svg></div>
${taskCard()}
${+s.rate>3?`<div class="alert red">⚠️<span>نسبة الهلاك ${s.rate}%، أعلى من الحد المقبول 3%. افحص التهوية والتطعيمات.</span></div>`:''}
<div class="kpis"><button class="kpi" data-a="k" data-v="alive"><small>الأحياء</small><div class="num">${s.al}</div></button><button class="kpi" data-a="k" data-v="preg"><small>الدفيع والمقربة</small><div class="num">${s.pg}</div></button><button class="kpi bad" data-a="k" data-v="dead"><small>النفوق</small><div class="num">${s.dd}</div></button><button class="kpi bad" data-a="k" data-v="rate"><small>نسبة الهلاك</small><div class="num">${s.rate}%</div></button><button class="kpi gold" data-a="k" data-v="fin"><small>صافي الربح</small><div class="num">${fm(s.sales-s.exp)}</div></button></div>
<div class="card"><h3>الولادات القادمة</h3>${up.length?up.slice(0,4).map(b=>`<div class="row"><div style="flex:1"><b>${esc(b.tag)}</b> <span class="tag">${b.d>0?'بعد '+b.d+' يوم':'حان موعدها'}</span><div class="bar"><span style="width:${Math.min(100,Math.max(3,(1-b.d/Math.max(1,Math.round((new Date(b.due)-new Date(b.date))/864e5)))*100))}%"></span></div></div><small>${b.due}</small></div>`).join(''):'<p class="empty">ما فيه حمل مسجل. سجّل ضراب من تبويب الضراب.</p>'}</div>`};
V.herd=()=>`<div class="toolbar"><input id="q" placeholder="ابحث برقم الرأس أو السلالة"><select id="pf"><option value="">كل الأشباك</option>${PENS.map(p=>`<option>${p}</option>`).join('')}</select><select id="spf"><option value="">كل الأنواع</option><option>غنم</option><option>ماعز</option><option>إبل</option></select><button class="btn" data-a="addS">+ إضافة رأس</button></div><div class="card" id="hl"></div>`;
const herdList=()=>{const q=$('#q').value.trim(),p=$('#pf').value,r=D.sheep.filter(s=>(!q||(s.tag+s.type).includes(q))&&(!p||s.pen==p)&&(!$('#spf').value||(s.sp||'غنم')==$('#spf').value));$('#hl').innerHTML=r.length?r.map(s=>{const h=hs(s);return `<button class="row hr" data-a="id" data-v="${s.id}"><span class="st ${h.c}" style="margin:0"><i></i></span><span style="flex:1"><b>${esc(s.tag)}</b> ${esc(s.sp||'غنم')} ${esc(s.type)} ${s.gender=='ذكر'?'♂':'♀'}<br><small style="color:var(--mut)">${esc(s.pen)} | ${esc(s.status)}</small></span><i>‹</i></button>`}).join(''):'<p class="empty">ما لقينا نتيجة. جرّب بحث ثاني أو اضغط + لإضافة رأس.</p>'};
V.breed=()=>{const r=D.breed.map(b=>({...b,d:dl(b.due)})).sort((a,b)=>a.d-b.d);return `<div class="toolbar"><button class="btn" data-a="addB">+ تسجيل ضراب</button></div>${repeatCard()}<p style="color:var(--mut);margin-bottom:10px">مدة الحمل حسب النوع: غنم وماعز 150 يوم، إبل 390 يوم، ويحسب البرنامج موعد الولادة تلقائياً.</p>${r.map(b=>`<div class="card"><div class="row" style="border:0;padding:0"><div><b style="font-size:1.2rem">${esc(b.tag)}</b> <span class="tag">الفحل ${esc(b.sire)}</span></div><div>${(b.res||'حامل')=='انتظار'?`<button class="btn" data-a="chk" data-v="${b.id}">فحص الحمل</button>`:`<button class="btn" data-a="birth" data-v="${b.id}">تمت الولادة</button>`} <button class="mini d" data-a="delB" data-v="${b.id}">🗑</button></div></div><div class="bar"><span style="width:${Math.min(100,Math.max(2,(1-b.d/Math.max(1,Math.round((new Date(b.due)-new Date(b.date))/864e5)))*100))}%"></span></div><small style="color:var(--mut)">${(b.res||'حامل')=='انتظار'?'⏳ فحص الحمل '+(dl(b.chk)<=0?'مستحق الحين':'بعد '+dl(b.chk)+' يوم')+' | ':''}ضراب ${b.date} | ولادة ${b.due} | ${b.d>0?'باقي '+b.d+' يوم':b.d==0?'اليوم':'متأخرة '+(-b.d)+' يوم'}</small></div>`).join('')||'<p class="empty">ما فيه ضراب مسجل.</p>'}`};

fs:()=>{const r=document.documentElement,z=((+r.dataset.fs||0)+1)%3;r.dataset.fs=z;r.style.fontSize=[14.5,16.5,18.5][z]+'px';try{localStorage.setItem('marah_fs',z)}catch(e){}toast('حجم الخط: '+['عادي','كبير','كبير جداً'][z])},
find:()=>{const c=$('#qc').value.trim().toUpperCase(),o=$('#fr');if(!c){o.innerHTML='';return}const s=D.sheep.find(x=>x.tag.toUpperCase()==c||x.id.toUpperCase()==c);if(s){o.innerHTML=idCard(s.id);return}const d=D.dead.find(x=>x.tag.toUpperCase()==c);if(d){o.innerHTML=`<div class="alert red">☠️<span>${esc(d.tag)} مسجل نافق بتاريخ ${d.date} (${esc(d.reason)}).</span></div>`;return}const p=D.sheep.filter(x=>x.tag.toUpperCase().includes(c));o.innerHTML=p.length?`<div class="card"><h3>نتائج مشابهة</h3>${p.map(x=>`<button class="row hr" data-a="id" data-v="${x.id}"><b>${esc(x.tag)}</b><i>‹</i></button>`).join('')}</div>`:'<p class="empty">ما لقينا رأس بهذا الكود. تأكد منه وجرّب مرة ثانية.</p>'},
scan:async()=>{if(!('BarcodeDetector' in window))return toast('المسح غير مدعوم هنا، اكتب الكود');try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('#vid'),stop=()=>{st.getTracks().forEach(t=>t.stop());window.stopCam=null};window.stopCam=stop;v.srcObject=st;v.hidden=false;await v.play();const bd=new BarcodeDetector({formats:['code_39','code_128']}),loop=async()=>{if(!document.contains(v))return stop();try{const r=await bd.detect(v);if(r.length){stop();v.hidden=true;$('#qc').value=r[0].rawValue;A.find();return}}catch(e){}setTimeout(loop,300)};loop()}catch(e){toast('الكاميرا غير متاحة، اكتب الكود')}},
print:()=>window.print(),
photo:v=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=200;c.height=250;const x=c.getContext('2d'),r=Math.max(200/im.width,250/im.height);x.drawImage(im,(200-im.width*r)/2,(250-im.height*r)/2,im.width*r,im.height*r);D.sheep.find(s=>s.id==v).photo=c.toDataURL('image/jpeg',.7);save();openM(idCard(v))};im.src=URL.createObjectURL(f)};i.click()},
addV:t=>form('تسجيل تطعيم',[['to','الرأس أو الشبك','select',t?[t]:[...PENS,...tags()]],['name','التطعيم أو العلاج','select',['الحمى القلاعية','جدري الأغنام','الحمى الوادية','التسمم المعوي','مضاد طفيليات','أخرى']],['date','تاريخ الجرعة','date',T()],['days','الجرعة القادمة بعد (يوم)','number',180]],d=>{const tg=PENS.includes(d.to)?D.sheep.filter(s=>s.pen==d.to).map(s=>s.tag):[d.to];tg.forEach(g=>D.vax.push({id:uid(),tag:g,name:d.name,date:d.date,next:add(d.date,+d.days)}));re();toast('سُجل التطعيم لـ '+tg.length+' رأس')}),
addFd:()=>form('تسجيل علف',[['pen','الشبك','select',PENS],['item','النوع','select',['شعير','برسيم','نخالة','علف مركز','تبن']],['kg','الكمية (كجم)','number'],['cost','التكلفة (ر.س)','number'],['date','التاريخ','date',T()]],d=>{D.feed.push({id:uid(),...d,kg:+d.kg,cost:+d.cost});re()}),
delFd:v=>{D.feed=D.feed.filter(x=>x.id!=v);re('تم حذف السجل')},
rep:()=>{const s=stats();openM(`<h3>كشف مراح بتاريخ ${T()}</h3><p>الأحياء ${s.al} | الدفيع ${s.pg} | النفوق ${s.dd} (${s.rate}%) | الصافي ${fm(s.sales-s.exp)} ر.س</p>${tbl(D.sheep,['tag','type','pen','status'],['الرقم','السلالة','الشبك','الحالة'])}<div class="toolbar noprint"><button class="btn" data-a="print">🖨 طباعة أو حفظ PDF</button></div>`)},
bk:()=>{openM(`<h3>نسخة احتياطية</h3><p style="margin-bottom:8px">انسخ النص وخزنه في ملاحظاتك. للاستعادة الصقه هنا واضغط استعادة.</p><textarea id="bkt" style="width:100%;height:150px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px"></textarea><div class="toolbar"><button class="btn" id="b1">📋 نسخ</button><button class="btn" id="b2">♻️ استعادة</button></div>`);const t=$('#bkt');t.value=JSON.stringify(D);$('#b1').onclick=()=>{t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('تم النسخ')};$('#b2').onclick=()=>{try{const n=JSON.parse(t.value);if(!n.sheep)throw 0;D=n;D.vax=D.vax||[];D.feed=D.feed||[];D.hist=D.hist||[];re();closeM();toast('تمت الاستعادة')}catch(e){toast('النص غير صالح')}}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){snap=JSON.stringify(D);A[b.dataset.a](b.dataset.v)}});
$('#go').onclick=()=>$('#splash').classList.add('off');setTimeout(()=>$('#splash').classList.add('off'),5000);
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark';try{localStorage.setItem('marah_theme',r.dataset.theme)}catch(e){}};
try{const z=+localStorage.getItem('marah_fs')||0;document.documentElement.style.fontSize=[14.5,16.5,18.5][z]+'px';document.documentElement.dataset.fs=z}catch(e){}
addEventListener('beforeprint',()=>{$('#phd').textContent=new Date().toLocaleDateString('ar-SA')+' | '+(EM||'').split('@')[0];$('#pfy').textContent=new Date().getFullYear()});
init();
</script>
</body>
</html>
